[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-obsidian"
version = "0.1.0"
description = "Voice-controlled interface for Obsidian"
requires-python = ">=3.11"
dependencies = [
    "requests",
    "python-dotenv",
]

[tool.setuptools.packages.find]
where = ["src"]